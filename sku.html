     <title>Project - SKU</title>

</head>

<body style="background-image: url('https://i.pinimg.com/736x/95/62/bf/9562bf9d794f3d8d59f7e3fde205fdc4.jpg');">

<!--NAVBAR-->

    <nav class="navbar navbar-expand-lg navbar-ight bg-light p-3">

        <div class="container-fluid">

            <a class="navbar-brand" href="menu.html"><b>SKUper Market</b></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="menu.html" target="_self">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="sku.html" target="_self">SKU Generator</a></li>
                </ul>
            </div>



        </div>

    </nav>

<!--FORM-->

    <div class="container border-dark bg-light rounded-5 p-5 w-50 mt-5">

        <form>

            <h1 class="text-center">SKU Generator</h1><br>

            <label><b>Category</b></label><br>
            <select id="category" class="form-control">

                <option value="PERISHABLES"> Perishables</option>
                <option value="NON-PERISHABLES"> Non-Perishables</option>

            </select>
            <br>

            <label><b>Product Name</b></label><br>
            <input class="form-control" type="text" id="prodname" placeholder="E.g. Banana Bread">
            <br>

            <label><b>Stock Quantity</b></label><br>
            <input class="form-control" type="number" id="stockquan" placeholder="E.g. 67" min="0">
            <br>

            <label></label>

            <div class="text-center">

                <button type="button" py-click="generate_sku" class="btn btn-success">Generate SKU</button><br><br><br>

            </div>

            <h6 class="text-center">Your SKU will appear below:</h6><br>

            <div id="display" class="text-center"></div>


        </form>

    </div>

    <div id="result"></div>

    <br>

    <py-script src="main.py"></py-script>
